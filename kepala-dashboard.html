<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Kepala UPA - POLNES</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="bg-slate-900 text-white py-4 px-6 shadow-md flex justify-between items-center border-b border-amber-500">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 bg-amber-500 text-slate-950 font-bold rounded-full flex items-center justify-center">K</div>
            <div>
                <h1 class="font-bold text-base leading-tight">Dashboard Kepala UPA Bahasa</h1>
                <p class="text-[10px] text-slate-400">Laporan Eksekutif & Monitoring Kinerja</p>
            </div>
        </div>
        <button onclick="logoutStaff()" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded transition">Logout</button>
    </header>

    <main class="max-w-7xl mx-auto w-full px-6 py-8 flex-1 space-y-8">
        <!-- Stat Cards -->
        <div class="grid md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-xl border shadow-sm border-l-4 border-l-blue-900">
                <p class="text-xs font-bold text-slate-400 uppercase">Total Peserta TOEFL</p>
                <h3 id="stat-total-peserta" class="text-3xl font-extrabold text-slate-900 mt-2">0</h3>
            </div>
            <div class="bg-white p-6 rounded-xl border shadow-sm border-l-4 border-l-emerald-600">
                <p class="text-xs font-bold text-slate-400 uppercase">Tingkat Kelulusan</p>
                <h3 id="stat-persen-lulus" class="text-3xl font-extrabold text-emerald-600 mt-2">0%</h3>
            </div>
            <div class="bg-white p-6 rounded-xl border shadow-sm border-l-4 border-l-amber-500">
                <p class="text-xs font-bold text-slate-400 uppercase">Laporan Keluhan Selesai</p>
                <h3 id="stat-keluhan-selesai" class="text-3xl font-extrabold text-amber-600 mt-2">0</h3>
            </div>
        </div>

        <!-- Tombol Cetak Laporan PDF -->
        <div class="bg-white p-6 rounded-xl border shadow-sm flex justify-between items-center">
            <div>
                <h3 class="font-bold text-sm text-slate-900">Cetak Rekap Laporan Eksekutif</h3>
                <p class="text-xs text-slate-500">Unduh ringkasan hasil pengujian dan keluhan layanan dalam format PDF resmi.</p>
            </div>
            <button onclick="cetakLaporanKepala()" class="bg-blue-900 hover:bg-blue-950 text-white font-bold text-xs px-5 py-2.5 rounded-lg transition flex items-center gap-2">
                📄 Export Laporan PDF
            </button>
        </div>
    </main>

    <!-- JS SCRIPTS -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/report.js"></script>
    <script src="assets/js/auth.js"></script>
</body>
</html>
